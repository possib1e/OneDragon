name: Maintenance Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  python-syntax:
    name: Python syntax and CLI help
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile maintained entrypoints
        run: python -m compileall start.py module tests

      - name: Check CLI help
        run: python start.py --help

      - name: Check config option parsing
        run: python start.py --config config.example.yaml --check-config

      - name: Check JSON output summary
        run: python start.py --summarize-output targets.txt --summary-format json

      - name: Check Markdown output summary
        run: python start.py --summarize-output targets.txt --summary-format markdown

      - name: Run unit tests
        run: python -m unittest discover -s tests
